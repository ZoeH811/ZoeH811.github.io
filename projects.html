<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f0" />
    <meta
      name="description"
      content="Explore Zoe Hewitt's university and personal projects in software, games, simulation and AI."
    />
    <title>All Projects | Zoe Hewitt</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/script.js"></script>
    <script defer src="js/projects.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">Zoe Hewitt<span>.</span> </a>
        <nav class="library-nav" aria-label="Main navigation">
          <a class="inline-link" href="index.html#projects">← Back to portfolio</a>
        </nav>
      </div>
    </header>
    <main id="main" class="section container">
      <p class="eyebrow">THE PROJECT LIBRARY</p>
      <h1>Ideas, builds <em>&amp; experiments.</em></h1>
      <p class="library-intro">
        University work and personal projects, from completed builds to what's next.
      </p>
      <!-- Filter names match the form fields read by js/projects.js. -->
      <form id="project-filters" class="project-filters" aria-label="Filter and sort projects">
        <label
          >Status<select name="status">
            <option value="all">All statuses</option>
            <option value="completed">Completed</option>
            <option value="progress">In progress</option>
            <option value="future">Future plan</option>
          </select>
        </label>
        <label
          >Project type<select name="category">
            <option value="all">University &amp; personal</option>
            <option>University</option>
            <option>Personal</option>
          </select>
        </label>
        <label
          >Completion year<select name="year">
            <option value="all">All years</option>
          </select>
        </label>
        <label
          >Sort by<select name="sort">
            <option value="status">Completion status</option>
            <option value="newest">Completion date: newest first</option>
            <option value="oldest">Completion date: oldest first</option>
            <option value="name">Project name A–Z</option>
          </select>
        </label>
        <button type="reset" class="button button-outline">Reset filters</button>
      </form>
      <p id="project-count" role="status" aria-live="polite"></p>
      <!-- Project cards and result counts are populated by js/projects.js. -->
      <div class="project-grid" data-project-library></div>
      <div id="projects-empty" class="empty-state" hidden>
        <h2>No projects here yet.</h2>
        <p>Try another status, project type or completion year.</p>
      </div>
      <noscript>
        <p>Enable JavaScript to filter and view the project library.</p>
      </noscript>
    </main>
    <footer class="site-footer">
      <div class="container footer-inner">
        <a class="brand" href="index.html">Zoe Hewitt<span>.</span> </a>
        <a class="inline-link" href="index.html#contact">Get in touch ↗</a>
      </div>
    </footer>
  </body>
</html>
